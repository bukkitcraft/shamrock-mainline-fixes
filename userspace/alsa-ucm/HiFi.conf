# Use case configuration for General Mobile GM 5 Plus (shamrock)
# Audio Engineer Profile: QDSP6 + WCD9326/PM8916 + AW8738 + TPA6130A2

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RX1 DCB Switch' 1"
		cset "name='RX2 DCB Switch' 1"
		cset "name='RX1 DCB Cutoff' 4Hz"
		cset "name='RX2 DCB Cutoff' 4Hz"
		cset "name='RX1 Digital Volume' 68"
		cset "name='RX2 Digital Volume' 68"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Mono Speaker (AW8738 Class-K Boost)"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='Headphone Jack Switch' 1"
		cset "name='EAR_S' ZERO"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' Switch"
		cset "name='RDAC2 MUX' RX2"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RX2 MIX1 INP2' RX1"
		cset "name='RX2 Digital Volume' 62"
		shell "/usr/local/bin/aw8738_ctrl on"
	]

	DisableSequence [
		shell "/usr/local/bin/aw8738_ctrl off"
		cset "name='Speaker Switch' 0"
		cset "name='Headphone Jack Switch' 0"
		cset "name='HPHR' ZERO"
		cset "name='RX2 MIX1 INP2' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (TPA6130A2 Stereo Amp)"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		shell "/usr/local/bin/aw8738_ctrl off"
		cset "name='Headphone Jack Switch' 1"
		cset "name='Speaker Switch' 0"
		cset "name='EAR_S' ZERO"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
		cset "name='RDAC2 MUX' RX2"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RX1 Digital Volume' 68"
		cset "name='RX2 Digital Volume' 68"
		cset "name='Headphone Playback Volume' 48"
	]

	DisableSequence [
		cset "name='Headphone Jack Switch' 0"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackVolume "Headphone Playback Volume"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece Receiver (EAR_S)"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		shell "/usr/local/bin/aw8738_ctrl off"
		cset "name='Speaker Switch' 0"
		cset "name='Headphone Jack Switch' 0"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
		cset "name='EAR_S' Switch"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX1"
		cset "name='RX1 Digital Volume' 64"
		cset "name='RX2 Digital Volume' 64"
	]

	DisableSequence [
		cset "name='EAR_S' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic1" {
	Comment "Handset Main Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='Mic Jack Switch' 0"
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='TX1 HPF Switch' 1"
		cset "name='TX1 HPF Cutoff' 75Hz"
		cset "name='ADC1 Volume' 6"
		cset "name='TX1 Digital Volume' 80"
	]

	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
		cset "name='ADC1 Volume' 0"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		CaptureVolume "ADC1 Volume"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone (TRRS Jack)"

	ConflictingDevice [
		"Mic1"
	]

	EnableSequence [
		cset "name='Mic Jack Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='DEC1 MUX' ADC2"
		cset "name='CIC1 MUX' AMIC"
		cset "name='TX1 HPF Switch' 1"
		cset "name='TX1 HPF Cutoff' 75Hz"
		cset "name='ADC2 Volume' 2"
		cset "name='TX1 Digital Volume' 80"
	]

	DisableSequence [
		cset "name='Mic Jack Switch' 0"
		cset "name='DEC1 MUX' ZERO"
		cset "name='ADC2 MUX' ZERO"
		cset "name='ADC2 Volume' 0"
	]

	Value {
		CapturePriority 400
		CapturePCM "hw:${CardId},1"
		CaptureVolume "ADC2 Volume"
	}
}
