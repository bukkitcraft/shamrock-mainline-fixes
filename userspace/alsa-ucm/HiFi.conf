# Use case configuration for General Mobile GM 5 Plus (shamrock)
Syntax 3

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Headphones"
		"Earpiece"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHR' 1"
		cset "name='Speaker Switch' 1"
		cset "name='RX2 Digital Volume' 115"
		cset "name='Headphone Playback Volume' 63"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='HPHR' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' 1"
		cset "name='HPHR' 1"
		cset "name='RX1 Digital Volume' 90"
		cset "name='RX2 Digital Volume' 90"
		cset "name='Headphone Playback Volume' 45"
	]

	DisableSequence [
		cset "name='HPHL' 0"
		cset "name='HPHR' 0"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='HPHL' 1"
		cset "name='EAR_S' 1"
		cset "name='RX1 Digital Volume' 110"
	]

	DisableSequence [
		cset "name='EAR_S' 0"
		cset "name='HPHL' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic1" {
	Comment "Primary Microphone"

	EnableSequence [
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC1 Volume' 8"
	]

	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
	}
}
